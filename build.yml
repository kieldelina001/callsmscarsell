name: Build Android APK

# Runs when you upload/change files, and also when you press "Run workflow".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev \
            build-essential cmake libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Run the unit tests first
        run: |
          pip install openpyxl
          python -m unittest discover -s tests -v

      - name: Remember downloads between builds (makes later builds faster)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build the APK
        run: buildozer -v android debug

      - name: Save the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: car-promo-caller-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Save the build log if something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: .buildozer/logs/
          if-no-files-found: ignore
